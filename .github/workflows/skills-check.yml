name: Skills check

# Free dokimi checks, no model, no secret, no cost. Guide: docs/free-skills-check.md
# Only step 1 can fail the run (a skill that cannot load or breaks the skill format).
# The other steps report; their output is in the run summary and the artifact.

on:
  pull_request:
    paths:
      - 'plugins/**/skills/**'
      - 'template/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/skills-check.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/**/skills/**'
      - 'template/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: intel/dokimi/actions/setup@b30a1a200ceb126b0e9cd3c9c7ea34019981db6c
        with:
          dokimi-ref: b30a1a200ceb126b0e9cd3c9c7ea34019981db6c
      - name: Prepare output folder
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/out"
      - name: "1. Skills check (fails only on a skill that cannot load)"
        shell: bash
        run: dokimi catalog check --root . --kind skills --skip-nested --strict | tee "$RUNNER_TEMP/out/1-skills-check.txt"
      - name: "2. Static plan and receipts for every skill (report only)"
        if: always()
        shell: bash
        run: dokimi catalog eval . --tier static --out-dir "$RUNNER_TEMP/out/catalog-eval" | tee "$RUNNER_TEMP/out/2-static-plan.txt"
      - name: "3. Instruction files: do named paths, links and commands exist? (report only)"
        if: always()
        shell: bash
        run: dokimi repo scan . --out "$RUNNER_TEMP/out/repo-readiness.json" | tee "$RUNNER_TEMP/out/3-instruction-scan.txt"
      - name: "4. Instruction size: how much text loads at start (report only)"
        if: always()
        shell: bash
        run: dokimi repo budget . | tee "$RUNNER_TEMP/out/4-instruction-size.txt"
      - name: "5. Repository agent setup: build, test and instruction risks (report only)"
        if: always()
        shell: bash
        run: dokimi repo inspect . | tee "$RUNNER_TEMP/out/5-agent-setup.txt"
      - name: Show every result in the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Free skills checks'
            for f in "$RUNNER_TEMP"/out/*.txt; do
              [ -e "$f" ] || continue
              echo "### $(basename "$f" .txt)"; echo '```'; cat "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: skills-check-reports
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
